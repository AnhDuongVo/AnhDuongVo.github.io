# Repositories listed under the cards
repos:
  - name: consult-to-note
    text: Consultation transcript to a cited, number-checked clinical note; batch, live and served
    stack: Nemotron · NeMo Agent Toolkit · Riva
  - name: trial-matcher
    text: Trial eligibility from a FHIR record, criterion by criterion, with unknowns kept unknown
    stack: Nemotron · FHIR · ClinicalTrials.gov
  - name: csr-assistant
    text: Clinical study report sections drafted and checked against their source tables
    stack: Nemotron · ICH E3
  - name: ai-scientist
    text: Protein binder design that chains RFdiffusion, ProteinMPNN and Boltz-2 into a ranked report
    stack: BioNeMo NIMs
  - name: clinical-agentic-ai-demo
    text: One Streamlit page with the four agents' checks, no key needed
    stack: Streamlit
  - name: mcp-bionemo
    text: BioNeMo models as typed MCP tools for any MCP client
    stack: MCP · BioNeMo
  - name: agenteval
    text: Agent evaluation at two levels, behaviour from traces and claims against sources
    stack: LangGraph · LlamaIndex · OpenAI
  - name: rag-guidelines
    text: Retrieval over guidelines with every sentence verified against its cited source
    stack: vLLM · any OpenAI-compatible endpoint
  - name: agentsim
    text: Discrete-event simulator and cost model for agent workloads on a serving cluster
    stack: Python
