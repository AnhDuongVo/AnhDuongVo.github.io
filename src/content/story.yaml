statement: 'I apply AI to real-world problems in healthcare and the life sciences: LLM agents, their evaluation, and the tooling
  to run them.'
bio: 'I’m Maria (Anh Duong Vo), a machine learning researcher with eight years of experience in AI and data science across
  academia and industry. My work focuses on turning complex AI methods into practical systems for healthcare and the life
  sciences.


  During my PhD and postdoctoral research at ETH Zurich, I developed multimodal machine learning systems, collaborated with
  industry partners, and worked on healthcare projects using different AI technologies, including NVIDIA tools. At Johnson
  & Johnson Innovative Medicine, I designed LLM-based agent prototypes and evaluation methods informed by scientific experts.


  Alongside this work, I build open-source examples that help developers understand, evaluate and deploy agentic AI. Several
  projects reconstruct selected patterns from healthcare and life-science workflows as independent examples, mostly using
  NVIDIA technologies. These showcase repositories are distinct from the original research and industry systems. I also enjoy
  teaching, mentoring and helping technical communities grow.


  My [research publications](/about/#publications) and [code](https://github.com/AnhDuongVo) show the research and engineering
  behind this work.

  '
where_i_stand: 'I am looking for industry roles in agentic AI and applied machine learning, including roles that work closely
  with the developers who use these systems. If you would like to connect, collaborate, or discuss opportunities, feel free
  to reach out by email or on LinkedIn.

  '
