statement: "I apply AI to real-world problems in healthcare and the life sciences: LLM agents, their evaluation, and the tooling to run them."

bio: |
  Hi, I'm Maria (Anh Duong Vo), a postdoctoral researcher at the ETH AI Center and the Institute of Neuroinformatics (INI) in Zurich. I completed my PhD in June 2026 under the supervision of Luc Van Gool (Computer Vision Lab) and Benjamin Grewe.

  I work on agentic AI: LLM-based agents, retrieval-augmented generation, and the evaluation and guardrails needed to use them in healthcare. My recent projects are end-to-end clinical agents built with the NVIDIA NeMo stack (NeMo Agent Toolkit, NIM, Guardrails, BioNeMo), alongside vendor-neutral tooling for agent evaluation and citation-verified retrieval, and a simulator for agent workloads on serving clusters. The code is on [GitHub](https://github.com/AnhDuongVo).

  This year I was a research intern at Johnson & Johnson Innovative Medicine, where I designed LLM agent systems and evaluation frameworks that combine automated metrics with expert feedback to assess model reliability and performance. Across more than 8 years in AI I have shipped scalable models and data pipelines over multimodal data (images, video, audio, text, and neural recordings).

where_i_stand: |
  I am looking for industry roles in agentic AI and applied machine learning, including roles that work closely with the developers who use these systems. If you would like to connect, collaborate, or discuss opportunities, feel free to reach out by email or on LinkedIn.

